<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>arcelia-character</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    #app {
      width: 100%;
      height: 100%;
    }
    #app canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/addons/",
      "@pixiv/three-vrm": "./vendor/three-vrm.module.js"
    }
  }
  </script>
  <script>

    window.__arceliaInitWatchActive = true;
    window.addEventListener('error', (event) => {
      if (!window.__arceliaInitWatchActive) return;
      document.title = 'arcelia-character-init-failed:' + (event.message || 'unknown script error');
    });
    window.addEventListener('unhandledrejection', (event) => {
      if (!window.__arceliaInitWatchActive) return;
      const reason = event.reason && event.reason.message ? event.reason.message : String(event.reason);
      document.title = 'arcelia-character-init-failed:' + reason;
    });
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
